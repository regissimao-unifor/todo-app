<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <main class="container">
    <header class="header">
      <div class="header-label">Gerenciador</div>
      <h1 class="title">Minhas <span class="accent">Tarefas</span></h1>
      <p class="subtitle">Organize seu dia com clareza</p>
    </header>

    <section class="input-section">
      <div class="input-wrapper">
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="Nova tarefa..."
          maxlength="120"
          autocomplete="off"
          data-testid="task-input"
        />
        <button id="addBtn" class="add-btn" data-testid="add-btn">
          <span class="btn-icon">+</span>
          <span class="btn-text">Adicionar</span>
        </button>
      </div>
      <div id="errorMsg" class="error-msg" data-testid="error-msg"></div>
    </section>

    <section class="stats-bar" data-testid="stats-bar">
      <div class="stat">
        <span class="stat-number" id="totalCount" data-testid="total-count">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-number" id="doneCount" data-testid="done-count">0</span>
        <span class="stat-label">Concluídas</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-number" id="pendingCount" data-testid="pending-count">0</span>
        <span class="stat-label">Pendentes</span>
      </div>
    </section>

    <section class="filters" data-testid="filters">
      <button class="filter-btn active" data-filter="all" data-testid="filter-all">Todas</button>
      <button class="filter-btn" data-filter="pending" data-testid="filter-pending">Pendentes</button>
      <button class="filter-btn" data-filter="completed" data-testid="filter-completed">Concluídas</button>
    </section>

    <section class="list-section">
      <div id="loadingState" class="empty-state" data-testid="loading-state">
        <div class="spinner"></div>
        <p>Carregando tarefas...</p>
      </div>
      <ul id="taskList" class="task-list" data-testid="task-list"></ul>
      <div id="emptyState" class="empty-state hidden" data-testid="empty-state">
        <div class="empty-icon">✦</div>
        <p>Nenhuma tarefa aqui ainda.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
